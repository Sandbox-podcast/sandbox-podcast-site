<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#05090d" />
    <meta
      name="description"
      content="Support de l’épisode 003 de SANDBOX : Introduction, Radar, Talk et Clash."
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>SANDBOX | Épisode 003</title>
    <link rel="stylesheet" href="./show.css" />
    <script type="module" src="./show.js"></script>
  </head>
  <body>
    <header>
      <img src="../episode-002-bis/assets/logo.png" alt="SANDBOX" />
      <span class="episode-label">ÉPISODE 003</span>
      <nav class="chapters" aria-label="Séquences">
        <a href="#intro" data-chapter="Introduction">Introduction</a>
        <a href="#radar" data-chapter="Radar">Radar</a>
        <a href="#talk" data-chapter="Talk">Talk</a>
        <a href="#clash" data-chapter="Clash">Clash</a>
      </nav>
    </header>
    <main id="screen" tabindex="-1" aria-label="Diapositive">
      <p role="status">Chargement du support…</p>
    </main>
    <nav class="deck-controls" aria-label="Navigation du support">
      <button id="previous" type="button" aria-label="Diapositive précédente">Précédent</button>
      <label class="slide-picker"
        >Diapositive
        <select id="topics" aria-label="Choisir une diapositive"></select
      ></label>
      <output id="counter" aria-live="polite"></output>
      <button id="next" type="button" aria-label="Diapositive suivante">Suivant</button>
      <button
        id="speaker-notes-button"
        type="button"
        aria-expanded="false"
        aria-controls="speaker-notes"
        hidden
      >
        Notes (N)
      </button>
      <button id="present" type="button" aria-pressed="false" title="Mode live (P)">
        Mode live
      </button>
      <button id="fullscreen" type="button" title="Plein écran (F)">Plein écran</button>
    </nav>
    <p id="status" class="status" role="status"></p>
    <aside id="speaker-notes" aria-labelledby="speaker-notes-title" hidden>
      <button id="close-speaker-notes" type="button">Fermer les notes (N)</button>
      <h2 id="speaker-notes-title">Plan de discussion · 10 à 12 minutes</h2>
      <div id="speaker-notes-content"></div>
    </aside>
    <div id="live-controls" hidden>
      <button id="leave-live" type="button">Régie (P)</button>
    </div>
    <noscript>Activez JavaScript pour parcourir le support.</noscript>
  </body>
</html>
