<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Legacy : ajouter une couche ou repartir du produit ?</title>
  <desc id="desc">Le pari de Lou : comprendre le produit historique, le reconstruire avec l’IA dans un cadre clair, puis le tester. Cette position est présentée comme une intuition personnelle.</desc>
  <rect width="1920" height="1080" fill="#071016"/>
  <path d="M1320 0h600v1080h-420c-113-190-166-384-166-584 0-175 45-340 132-496z" fill="#0b1c25"/>
  <path d="M96 94h1728v892H96z" fill="none" stroke="#17313d" stroke-width="2"/>
  <text x="132" y="154" fill="#12bce6" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" letter-spacing="5">LE CLASH  /  01 · DÉVELOPPEMENT</text>
  <text x="132" y="294" fill="#eff6f9" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="700" letter-spacing="1">LEGACY :</text>
  <text x="132" y="400" fill="#eff6f9" font-family="Arial,Helvetica,sans-serif" font-size="78" font-weight="700" letter-spacing="-2">AJOUTER UNE COUCHE</text>
  <text x="132" y="494" fill="#eff6f9" font-family="Arial,Helvetica,sans-serif" font-size="78" font-weight="700" letter-spacing="-2">OU REPARTIR DU PRODUIT ?</text>
  <text x="136" y="566" fill="#9fb9c7" font-family="Arial,Helvetica,sans-serif" font-size="29">Monolithes, décisions accumulées, règles implicites.</text>
  <text x="136" y="614" fill="#9fb9c7" font-family="Arial,Helvetica,sans-serif" font-size="29">Parfois dix ans de code et des dizaines d’équipes.</text>

  <rect x="132" y="700" width="504" height="160" rx="10" fill="#0f2029" stroke="#274452" stroke-width="2"/>
  <circle cx="180" cy="748" r="20" fill="#12bce6"/>
  <text x="180" y="756" text-anchor="middle" fill="#071016" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700">1</text>
  <text x="222" y="755" fill="#eff6f9" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" letter-spacing="2">COMPRENDRE</text>
  <text x="166" y="810" fill="#9fb9c7" font-family="Arial,Helvetica,sans-serif" font-size="24">Reverse-engineer le produit.</text>

  <path d="M660 780h46m-15-15 15 15-15 15" fill="none" stroke="#12bce6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="722" y="700" width="504" height="160" rx="10" fill="#0f2029" stroke="#274452" stroke-width="2"/>
  <circle cx="770" cy="748" r="20" fill="#12bce6"/>
  <text x="770" y="756" text-anchor="middle" fill="#071016" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700">2</text>
  <text x="812" y="755" fill="#eff6f9" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" letter-spacing="2">RECONSTRUIRE</text>
  <text x="756" y="810" fill="#9fb9c7" font-family="Arial,Helvetica,sans-serif" font-size="24">Avec l’IA, dans un cadre clair.</text>

  <path d="M1250 780h46m-15-15 15 15-15 15" fill="none" stroke="#12bce6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1312" y="700" width="476" height="160" rx="10" fill="#102a35" stroke="#12bce6" stroke-width="2"/>
  <circle cx="1360" cy="748" r="20" fill="#12bce6"/>
  <text x="1360" y="756" text-anchor="middle" fill="#071016" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700">3</text>
  <text x="1402" y="755" fill="#eff6f9" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" letter-spacing="2">FAIRE ÉVOLUER</text>
  <text x="1346" y="810" fill="#9fb9c7" font-family="Arial,Helvetica,sans-serif" font-size="24">Sur une base testable.</text>

  <rect x="132" y="902" width="1656" height="54" rx="8" fill="#122b36"/>
  <text x="160" y="938" fill="#12bce6" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" letter-spacing="2">MON PARI</text>
  <text x="350" y="938" fill="#eff6f9" font-family="Arial,Helvetica,sans-serif" font-size="25">Une base cohérente sera plus simple à faire évoluer avec l’IA. C’est une intuition, pas une règle générale.</text>
</svg>
