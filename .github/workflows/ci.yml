# Quality Gates à chaque push et chaque PR (master prompt §35.1 / §35.2).
# Périmètre actuel et validations : docs/testing.md.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-pipelines:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/social-network-manager/episode-02/camera-unique-v2/requirements-qa.txt
      - run: python -m unittest discover -s apps/site/scripts -p test_news_summarize.py
      - run: python -m unittest discover -s kits-relais/2026-10-18/production -p test_monter.py -v
      - run: python -m unittest discover -s tools/social-network-manager/episode-02/camera-unique-v2 -p test_pipeline.py -v
      - run: python tools/social-network-manager/episode-02/camera-unique-v2/pipeline.py check

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Installer l'outil officiel de recette Cloudflare
        run: npm install --prefix apps/site/.local/watchdog-tools --no-audit --no-fund --package-lock=false wrangler@4.151.2
      - name: Compiler le contrôleur sans déploiement
        run: node apps/site/scripts/build-automation-watchdog-worker.mjs
      - name: Vérifier le Worker et son stockage SQLite sans appel distant
        run: pnpm --filter @podcast/site test:automation:worker
      # Le build du site génère toutes les pages statiques et les images OpenGraph : il échoue si un contenu ou une route est cassé.
      - run: pnpm --filter @podcast/site build
      - run: pnpm --filter @podcast/site test:og:tracing
      - run: pnpm --filter @podcast/site test:admin:http
      - run: pnpm --filter @podcast/site test:public-routes
      - run: pnpm --filter @podcast/site exec playwright install --with-deps chromium
      - run: pnpm --filter @podcast/site test:seo:e2e
      - run: pnpm --filter @podcast/site test:analytics:e2e
      - run: pnpm --filter @podcast/site test:news:e2e
      - run: pnpm --filter @podcast/site test:episode:e2e
      - run: pnpm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test -n "$BASE_SHA"
            test -n "$HEAD_SHA"
            docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
              detect --source /repo --log-opts="$BASE_SHA..$HEAD_SHA" --redact --verbose
          else
            docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
              detect --source /repo --redact --verbose
          fi
