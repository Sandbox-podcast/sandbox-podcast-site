# Quality Gates à chaque push et chaque PR (master prompt §35.1 / §35.2).
# Statut : écrit mais jamais exécuté. À valider au premier run (voir docs/testing.md).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Le build du site génère toutes les pages statiques et les images OpenGraph : il échoue si un contenu ou une route est cassé.
      - run: pnpm --filter @podcast/site build
      - run: pnpm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test -n "$BASE_SHA"
            test -n "$HEAD_SHA"
            docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
              detect --source /repo --log-opts="$BASE_SHA..$HEAD_SHA" --redact --verbose
          else
            docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
              detect --source /repo --redact --verbose
          fi
