name: SANDBOX quotidien News et classements
run-name: ${{ github.event_name == 'schedule' && 'SANDBOX quotidien News et classements' || format('SANDBOX News {0}', inputs.mode || 'refresh') }}

on:
  schedule:
    # Une collecte quotidienne, à 03:37 UTC.
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Action à effectuer
        type: choice
        required: true
        default: refresh
        options:
          - refresh
          - due

permissions:
  contents: read
  actions: read

concurrency:
  group: news-refresh
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main' && vars.SANDBOX_NEWS_PUBLIC == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      workers: ${{ steps.workers.outputs.workers }}
      worker-count: ${{ steps.workers.outputs.worker-count || '0' }}
      processing-started-at: ${{ steps.workers.outputs.processing-started-at }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Relire le cycle News sous le verrou partagé
        id: preflight
        env:
          SANDBOX_NEWS_ORIGIN: ${{ vars.SANDBOX_CHARTS_ORIGIN || 'https://www.sandboxpodcast.fr' }}
          GITHUB_TOKEN: ${{ github.token }}
          AUTOMATION_MODE: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode || 'refresh') || 'due' }}
        run: node apps/site/scripts/automation-workflow-preflight.ts news

      - name: Collecter toutes les sources et conserver les candidats en base
        if: steps.preflight.outputs.collect-needed == 'true'
        env:
          SANDBOX_NEWS_ORIGIN: ${{ vars.SANDBOX_CHARTS_ORIGIN || 'https://www.sandboxpodcast.fr' }}
          CRON_SECRET: ${{ secrets.SANDBOX_CHARTS_CRON_SECRET }}
        run: pnpm --filter @podcast/site news:automation:refresh --collect-only

      - name: Dimensionner le traitement selon les candidats prêts
        id: workers
        if: steps.preflight.outputs.process-needed == 'true'
        env:
          SANDBOX_NEWS_ORIGIN: ${{ vars.SANDBOX_CHARTS_ORIGIN || 'https://www.sandboxpodcast.fr' }}
          CRON_SECRET: ${{ secrets.SANDBOX_CHARTS_CRON_SECRET }}
        run: node apps/site/scripts/news-worker-plan.ts

  process:
    needs: collect
    if: needs.collect.outputs.worker-count != '0'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.collect.outputs.workers || '{"worker":[1]}') }}
    name: Rédaction News ${{ matrix.worker }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Restaurer les modèles locaux
        uses: actions/cache@v4
        with:
          path: |
            apps/site/.local/news-summary-model/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
            apps/site/.local/news-summarizer-venv
            apps/site/.local/news-translator-models
            apps/site/.local/news-translator-sbd
            apps/site/.local/news-translator-venv
            apps/site/.local/argos-runtime
          key: sandbox-news-v3-ubuntu-py311-argos111-qwen3instruct-a06e946
      - name: Installer le modèle de résumé local
        env:
          SANDBOX_NEWS_SUMMARY_SETUP_PYTHON: python
        run: pnpm --filter @podcast/site news:summarizer:setup

      - name: Générer, traduire et publier le prochain lot de la file
        env:
          SANDBOX_NEWS_PARALLEL_WORKER: '1'
          SANDBOX_NEWS_ORIGIN: ${{ vars.SANDBOX_CHARTS_ORIGIN || 'https://www.sandboxpodcast.fr' }}
          CRON_SECRET: ${{ secrets.SANDBOX_CHARTS_CRON_SECRET }}
        run: pnpm --filter @podcast/site news:automation:refresh --process-only

  # Traductions suspendues : site en français uniquement (Lou, 21 octobre 2026).

  health:
    needs: [collect, process]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && vars.SANDBOX_NEWS_PUBLIC == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vérifier la fraîcheur du fil public
        env:
          SANDBOX_NEWS_PUBLICATION_SINCE: ${{ needs.collect.outputs.worker-count != '0' && needs.collect.outputs.processing-started-at || '' }}
          SANDBOX_NEWS_ORIGIN: ${{ vars.SANDBOX_CHARTS_ORIGIN || 'https://www.sandboxpodcast.fr' }}
        run: node apps/site/scripts/news-health.ts

      - name: Mesurer les candidats restants après traitement
        if: ${{ !cancelled() }}
        env:
          SANDBOX_NEWS_ORIGIN: ${{ vars.SANDBOX_CHARTS_ORIGIN || 'https://www.sandboxpodcast.fr' }}
          CRON_SECRET: ${{ secrets.SANDBOX_CHARTS_CRON_SECRET }}
        run: node apps/site/scripts/news-worker-plan.ts

  freshness:
    # Ce contrôle public reste possible même sans secret de collecte.
    if: github.event_name == 'schedule'
    concurrency:
      group: charts-collect-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      recovery-needed: ${{ steps.public-check.outputs.recovery-needed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Contrôler les éditions servies aux lecteurs
        id: public-check
        env:
          CHARTS_ORIGIN: ${{ vars.SANDBOX_CHARTS_ORIGIN || 'https://www.sandboxpodcast.fr' }}
        run: node apps/site/scripts/charts-refresh.ts --check

      - name: Mesurer les poussées GitHub
        # Une édition périmée ne doit pas empêcher la collecte quotidienne du signal.
        # L'échec du contrôle précédent reste un échec du job.
        if: ${{ !cancelled() && vars.SANDBOX_CHARTS_BURSTS_ENABLED == 'true' }}
        env:
          CHARTS_ORIGIN: ${{ vars.SANDBOX_CHARTS_ORIGIN || 'https://www.sandboxpodcast.fr' }}
          CRON_SECRET: ${{ secrets.SANDBOX_CHARTS_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CHARTS_ORIGIN"
          test -n "$CRON_SECRET"
          case "$CHARTS_ORIGIN" in https://*) ;; *) echo "SANDBOX_CHARTS_ORIGIN doit utiliser HTTPS." >&2; exit 1 ;; esac
          CHARTS_ORIGIN="${CHARTS_ORIGIN%/}"
          curl --silent --show-error --fail-with-body --retry 0 --max-time 360 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$CHARTS_ORIGIN/api/cron/github-bursts"

  recovery:
    needs: freshness
    # Le contrôle peut échouer sur Rising sans nécessiter de nouvelle collecte.
    if: ${{ !cancelled() && needs.freshness.outputs.recovery-needed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: charts-collect-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reprendre le créneau dû absent après une nouvelle vérification
        env:
          CHARTS_ORIGIN: ${{ vars.SANDBOX_CHARTS_ORIGIN || 'https://www.sandboxpodcast.fr' }}
          CRON_SECRET: ${{ secrets.SANDBOX_CHARTS_CRON_SECRET }}
        run: node apps/site/scripts/charts-refresh.ts --recover
