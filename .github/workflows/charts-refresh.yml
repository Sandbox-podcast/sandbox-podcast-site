name: SANDBOX CHARTS refresh

on:
  schedule:
    - cron: '17 1 * * *'
    - cron: '17 3,15 * * *'
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: charts-${{ github.event.schedule || 'manual-refresh' }}
  cancel-in-progress: false

jobs:
  discovery:
    if: github.event_name == 'schedule' && github.event.schedule == '17 1 * * *'
    runs-on: ubuntu-latest
    # Deux appels de six minutes au maximum, avec une marge pour le runner.
    timeout-minutes: 15
    steps:
      - name: Collecter Trending et découvrir les candidats
        env:
          CHARTS_ORIGIN: ${{ vars.SANDBOX_CHARTS_ORIGIN || 'https://www.sandboxpodcast.fr' }}
          CRON_SECRET: ${{ secrets.SANDBOX_CHARTS_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CHARTS_ORIGIN"
          if [ "${#CRON_SECRET}" -lt 16 ]; then
            echo '::error::Configurer SANDBOX_CHARTS_CRON_SECRET avec le secret CRON_SECRET de Vercel.'
            exit 1
          fi
          case "$CHARTS_ORIGIN" in https://*) ;; *) echo "SANDBOX_CHARTS_ORIGIN doit utiliser HTTPS." >&2; exit 1 ;; esac
          CHARTS_ORIGIN="${CHARTS_ORIGIN%/}"
          call_job() {
            # Un 503 applicatif peut suivre une collecte partielle déjà persistée.
            # Ne pas rejouer trois fois ce travail dans la même fenêtre.
            curl --silent --show-error --fail-with-body --retry 0 --max-time 360 \
              --header "Authorization: Bearer $CRON_SECRET" \
              "$CHARTS_ORIGIN/api/cron/$1"
          }
          result=0
          call_job github-trending || result=1
          call_job github-discovery || result=1
          exit "$result"

  refresh:
    if: (github.event_name == 'schedule' && github.event.schedule == '17 3,15 * * *') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: charts-collect-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Collecter, reprendre les lots incomplets et vérifier les publications
        env:
          CHARTS_ORIGIN: ${{ vars.SANDBOX_CHARTS_ORIGIN || 'https://www.sandboxpodcast.fr' }}
          CRON_SECRET: ${{ secrets.SANDBOX_CHARTS_CRON_SECRET }}
        run: node apps/site/scripts/charts-refresh.ts

  freshness:
    # Ce contrôle public reste possible même sans secret de collecte.
    if: github.event_name == 'schedule' && github.event.schedule == '23 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Contrôler les éditions servies aux lecteurs
        env:
          CHARTS_ORIGIN: ${{ vars.SANDBOX_CHARTS_ORIGIN || 'https://www.sandboxpodcast.fr' }}
        run: node apps/site/scripts/charts-refresh.ts --check

      - name: Mesurer les poussées horaires
        # Une édition périmée ne doit pas empêcher la collecte du signal horaire.
        # L'échec du contrôle précédent reste un échec du job.
        if: ${{ !cancelled() && vars.SANDBOX_CHARTS_BURSTS_ENABLED == 'true' }}
        env:
          CHARTS_ORIGIN: ${{ vars.SANDBOX_CHARTS_ORIGIN || 'https://www.sandboxpodcast.fr' }}
          CRON_SECRET: ${{ secrets.SANDBOX_CHARTS_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CHARTS_ORIGIN"
          test -n "$CRON_SECRET"
          case "$CHARTS_ORIGIN" in https://*) ;; *) echo "SANDBOX_CHARTS_ORIGIN doit utiliser HTTPS." >&2; exit 1 ;; esac
          CHARTS_ORIGIN="${CHARTS_ORIGIN%/}"
          curl --silent --show-error --fail-with-body --retry 2 --retry-all-errors --max-time 360 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$CHARTS_ORIGIN/api/cron/github-bursts"
